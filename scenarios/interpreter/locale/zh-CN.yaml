event.rain.message: 雨点敲在屋顶上。田里会高兴的。
event.fog_thickens.message: 静雾变浓了。今天你看到的，会比你以为的少。
event.fog_lifts.message: 雾散了一会儿。
event.berry_season.message: 浆果丛压弯了枝。
event.wanderer.message: 一个流浪者从雾里走出来，问能不能留下。
event.wisp_fault.message: 一只工灵噼啪响了两声，落进草里。它需要歇一天。
event.odd_find.message: 你在废墟里翻到一铁盒回形针，按大小排好了。有人数过它们。
