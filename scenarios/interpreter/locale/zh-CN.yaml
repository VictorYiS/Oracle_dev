prop.board.name: 告示板
prop.board.text: ◇ 神谕公告：东堤供电率 100%。登记在册的住宅全部通电。旧账房已停用。
prop.office.name: 译者的窗口
prop.kiosk.name: 神谕亭
prop.kiosk.text: 神谕：“东堤一切正常。你不必过河，我替你看过了。”
prop.mailbox.name: 信箱
prop.mailbox.text: 信箱里塞满了寄往“东堤 17乙”的信，每一封都盖着“查无此址”。
prop.rail.name: 栏杆
prop.lamp.name: 路灯
prop.boat.name: 平底船
prop.boat.text: 一条平底船拴在铁环上。船身上有人用粉笔写着：“桥快，河静。”
prop.crates.name: 木箱
prop.archive.name: 档案架
prop.archive.text: 几百本账册，都是原件。每一本上都贴着一张蓝色小标签：已数字化 · 无需查阅。
prop.counter.name: 办事柜台
prop.counter.text: 书记员：“原件？还留着，在后面。在你的窗口说一声，我们给你调过去。要等一会儿。”
prop.desk_17b.name: 书桌
prop.desk_17b.text: 一张 17乙 供电登记表的复写件。住户：0，写在一个 3 上面。供电：正常，写在“已切断 · 10 月 3 日”上面。
prop.shelf_17b.name: 书架
prop.shelf_17b.text: 供电日志第 1 到第 3 册。第 4 册的位置空着，灰尘上有一道新鲜的印子。
prop.meters.name: 线路电表
prop.meters.text: 东堤线路的电表，指针不会说谎：用掉的电，比供电局账上登记的多。
prop.switchboard.name: 配电盘
prop.switchboard.text: 配电盘上有一张手写的卡片：“别信屏幕，信指针。”

