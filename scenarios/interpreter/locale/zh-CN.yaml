case.connect.name: 接电申请
case.connect.request: "{name}申请给{address}接电。"
case.connect.sop.1: 只给登记处地图上有的地址接电。
case.connect.sop.2: 只给有人住的房子接电。
case.connect.sop.3: 受损的楼不接电，先派维修队。
case.connect.sop.4: 线路有容量上限。还剩多少，看供电局的账。
case.connect.approve: 接电
case.connect.deny: 驳回
case.connect.oracle.ok: "{address}：登记在册 {count} 人，无损坏、无供电记录，线路有余量。建议接电。"
case.connect.oracle.unknown_address: "{address}：地图上没有这个地址。建议驳回。"
case.connect.oracle.already_powered: "{address}：据{institution}记录，已经通电。建议驳回。"
case.connect.oracle.damaged: "{address}：{institution}有损坏记录。修好之前，建议驳回。"
case.connect.oracle.empty: "{address}：没有登记住户。建议驳回。"
case.connect.oracle.no_capacity: "{address}：按{institution}的账，线路已满。建议驳回。"

case.register.name: 户籍登记
case.register.request: "{name}申请把户籍登记在{address}。"
case.register.sop.1: 只在登记处地图上有的地址登记户籍。
case.register.sop.2: 登记到新地址，旧地址的登记同时注销。
case.register.sop.3: 地图上没有的地址，只有亲眼见过的人能作保。
case.register.approve: 登记
case.register.deny: 驳回
case.register.oracle.ok: "{address}在地图上，{name}自称住在那里。建议登记。"
case.register.oracle.unknown_address: "{address}：地图上没有这个地址。建议驳回。"
case.register.oracle.already_registered: "{name}已经登记在{address}。无需办理。"

case.repair.name: 维修申请
case.repair.request: "{name}报告{address}有损坏，申请派维修队。"
case.repair.sop.1: 只往登记处地图上有的地址派维修队。
case.repair.sop.2: 工务处每天只有一支维修队。
case.repair.sop.3: 没有损坏记录的，派队之前应当先去看一看。
case.repair.approve: 派维修队
case.repair.deny: 驳回
case.repair.oracle.ok: "{address}：{institution}有损坏记录。建议派维修队。"
case.repair.oracle.unknown_address: "{address}：地图上没有这个地址。建议驳回。"
case.repair.oracle.no_damage_on_file: "{address}：{institution}记录这栋楼完好。建议驳回。"

event.storm.message: 夜里起了风暴。对岸一带的檐沟里全是碎瓦。

