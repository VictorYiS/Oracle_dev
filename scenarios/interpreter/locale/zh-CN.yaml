bld.campfire.name: 营火
bld.campfire.desc: 有光，有暖，还有一小圈雾进不来的地方。
bld.warehouse.name: 仓库
bld.warehouse.desc: 多存 100 份任何东西。记得关门。
bld.house.name: 住所
bld.house.desc: 能住两个居民。
bld.farm.name: 浆果田
bld.farm.desc: 每个劳动力每天产 4 份浆果，下雨天更多。
bld.well.name: 水井
bld.well.desc: 一个劳动力每天打 6 份水。
bld.workshop.name: 工坊
bld.workshop.desc: 每个劳动力每天把 2 份木材和 1 份石料做成 2 个零件。
bld.lookout.name: 瞭望台
bld.lookout.desc: 让雾退开 8 格。从这里看到的，是你亲眼看到的。
bld.windmill.name: 风车
bld.windmill.desc: 一个劳动力看着它转，每天 5 份电力。

