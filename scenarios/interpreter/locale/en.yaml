bld.campfire.name: Campfire
bld.campfire.desc: Light, warmth, and a small circle the fog stays out of.
bld.warehouse.name: Warehouse
bld.warehouse.desc: Holds 100 more of anything. Keep the door shut.
bld.house.name: House
bld.house.desc: Room for two residents.
bld.farm.name: Berry farm
bld.farm.desc: Each worker grows 4 berries a day, more when it rains.
bld.well.name: Well
bld.well.desc: One worker draws 6 water a day.
bld.workshop.name: Workshop
bld.workshop.desc: Turns 2 wood and 1 stone into 2 parts, per worker per day.
bld.lookout.name: Lookout
bld.lookout.desc: Keeps the fog back for 8 tiles. What you see from here, you saw yourself.
bld.windmill.name: Windmill
bld.windmill.desc: One worker keeps it turning, for 5 power a day.

