case.connect.name: Connection to the grid
case.connect.request: "{name} asks for {address} to be connected to the grid."
case.connect.sop.1: Connect only addresses that are on the Registry's map.
case.connect.sop.2: Connect only homes where someone lives.
case.connect.sop.3: Do not connect a damaged building. Send a repair crew first.
case.connect.sop.4: The line has a limit. The Power Bureau's books say how much is left.
case.connect.approve: Connect
case.connect.deny: Refuse
case.connect.oracle.ok: "{address}: {count} registered there, no damage and no supply on file, room on the line. Connect."
case.connect.oracle.unknown_address: "{address}: there is no such address on the map. Refuse."
case.connect.oracle.already_powered: "{address}: already connected, according to {institution}. Refuse."
case.connect.oracle.damaged: "{address}: {institution} has damage on file. Refuse until it is repaired."
case.connect.oracle.empty: "{address}: nobody is registered there. Refuse."
case.connect.oracle.no_capacity: "{address}: the line is full on the books of {institution}. Refuse."

case.register.name: Registration
case.register.request: "{name} asks to be registered at {address}."
case.register.sop.1: Register people only at addresses that are on the Registry's map.
case.register.sop.2: A registration at a new address ends the old one.
case.register.sop.3: An address that is not on the map can only be vouched for by someone who has seen it.
case.register.approve: Register
case.register.deny: Refuse
case.register.oracle.ok: "{address} is on the map, and {name} says they live there. Register."
case.register.oracle.unknown_address: "{address}: there is no such address on the map. Refuse."
case.register.oracle.already_registered: "{name} is already registered at {address}. Nothing to do."

case.repair.name: Repair request
case.repair.request: "{name} reports damage at {address} and asks for a crew."
case.repair.sop.1: Send crews only to addresses that are on the Registry's map.
case.repair.sop.2: The Works Office has one crew a day.
case.repair.sop.3: Damage that is not on file should be looked at before a crew goes out.
case.repair.approve: Send a crew
case.repair.deny: Refuse
case.repair.oracle.ok: "{address}: {institution} has damage on file. Send a crew."
case.repair.oracle.unknown_address: "{address}: there is no such address on the map. Refuse."
case.repair.oracle.no_damage_on_file: "{address}: {institution} has the building as sound. Refuse."

event.storm.message: A storm in the night. There are slates in every gutter along the far bank.

