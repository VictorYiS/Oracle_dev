event.rain.message: Rain drums on the roofs. The farms will be glad of it.
event.fog_thickens.message: The Hush thickens. Today you will see less than you think.
event.fog_lifts.message: The fog lifts for a while.
event.berry_season.message: The berry bushes are heavy with fruit.
event.wanderer.message: A wanderer walks out of the fog and asks to stay.
event.wisp_fault.message: A wisp sputters and settles in the grass. It needs a day.
event.odd_find.message: In the ruins you find a tin of paperclips, sorted by size. Someone counted them.
