prop.board.name: Notice board
prop.board.text: "◇ ORACLE NOTICE. Supply on the East Bank stands at 100%. Every registered home is connected. The Old Counting House is closed."
prop.office.name: The Interpreter's window
prop.kiosk.name: Oracle kiosk
prop.kiosk.text: 'The Oracle: "Everything on the East Bank is in order. There is no need to go across. I have looked for you."'
prop.mailbox.name: Letter box
prop.mailbox.text: "Letters for East Bank 17B, every one of them stamped NO SUCH ADDRESS."
prop.rail.name: Railing
prop.lamp.name: Street lamp
prop.boat.name: Punt
prop.boat.text: 'A punt tied to an iron ring. Someone has chalked on the hull: "the bridge is quicker, the river is quieter".'
prop.crates.name: Crates
prop.archive.name: Archive shelves
prop.archive.text: "Ledgers by the hundred, the originals. Each carries a small blue sticker: DIGITISED · NO NEED TO CONSULT."
prop.counter.name: Clerk's counter
prop.counter.text: 'The clerk: "Originals? We still keep them, out the back. Ask at your window and we will fetch them. It takes a while."'
prop.desk_17b.name: Desk
prop.desk_17b.text: "A carbon copy of a power form for 17B. Occupants: 0, written over a 3. Supply: normal, written over CUT · 3 OCT."
prop.shelf_17b.name: Shelf
prop.shelf_17b.text: "Power logs, volumes 1 to 3. The space for volume 4 is empty, and the dust there is fresh."
prop.meters.name: Line meters
prop.meters.text: "The East Bank line, in honest needles: more is being drawn than the Bureau has on its books."
prop.switchboard.name: Switchboard
prop.switchboard.text: 'A hand-lettered card on the switchboard: "DO NOT TRUST THE SCREEN. TRUST THE NEEDLE."'

