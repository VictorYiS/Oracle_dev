# The trade-off numbers. These are the values the P0 economy search recommended: all four
# design checks pass with a margin, and "moderate play wins" still holds with every value
# nudged by ±15%. After a change, run `npm run econ` to check again; `npm test` guards the checks too.
economy:
  daily_petitions: 5
  petition_slots: { glance: 1, ponder: 2, decree: 3 }
  petition_debt: { glance: 0.75, ponder: 1.5, decree: 3 }
  interest_rate: 0.10
  understanding_debt_per_rule: 0.6
  repay:
    verify: 1.25
    verify_catch: 2.5
    manual_per_hour: 0.5
    manual_daily_cap: 2
    translate: 3
    fast_fraction: 0.8
  distortion: { base: 0.015, per_debt: 0.002, max: 0.6 }
  collection_thresholds: [30, 60, 100]
  collection_relief: 0.45
  collection_cooldown_days: 4
  boon_offer_every_days: 3
  boon_offer_size: 3
