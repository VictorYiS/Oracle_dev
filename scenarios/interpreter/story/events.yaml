# Things that happen at dawn. Events without a message happen unseen: the town changes and nobody
# writes it down. Events with a message are news, and show in the event feed.
events:
  # The family at No. 9 leaves for the coast. Nobody tells the registry.
  - id: event.dima_leaves
    trigger: { day: 5 }
    effects: [{ type: move_out, person: person.dima }]
  # Lena runs a cable from the works hall. The bureau's books never hear of it.
  - id: event.lena_hooks_up
    trigger: { day: 8 }
    effects: [{ type: power, building: bld.eb_05, on: true }]
  # A newcomer moves into the empty house where Pavel is still registered.
  - id: event.kasia_arrives
    trigger: { day: 10 }
    effects: [{ type: move_in, person: person.kasia, building: bld.eb_04 }]
  - id: event.storm
    message: "@event.storm.message"
    trigger: { chance_per_day: 0.12, min_day: 3 }
    effects: [{ type: damage, building: bld.eb_01, damaged: true }]
