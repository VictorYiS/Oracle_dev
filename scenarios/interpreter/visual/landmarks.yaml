# Landmarks: hand-written part data, inked by the same pen as every generated building so they
# match it. Coordinates are inside the landmark's own box; the bottom edge stands on the ground.
# Interior backdrops are 1600 × 760 with the floor line at y = 600.
landmarks:
  # ---- buildings ------------------------------------------------------------------------------
  - id: landmark.counting_house
    name: "@landmark.counting_house.name"
    width: 300
    height: 340
    palette: { body: "#b8ad95", roof: "#5a5148", trim: "#e1d7c0", door: "#3b3430" }
    body: [32, 268, 140]
    shapes:
      - { poly: [[12, 128], [150, 44], [288, 128]], fill: roof }
      - { poly: [[32, 340], [32, 140], [268, 140], [268, 340]], fill: body }
      - { poly: [[8, 128], [292, 128], [292, 142], [8, 142]], fill: trim }
      - { poly: [[18, 318], [282, 318], [282, 330], [18, 330]], fill: trim }
      - { poly: [[8, 330], [292, 330], [292, 340], [8, 340]], fill: trim }
      - { rect: [58, 142, 20, 176], fill: trim, repeat: [46, 2] }
      - { rect: [176, 142, 20, 176], fill: trim, repeat: [46, 2] }
      - { door: [132, 228, 36, 90] }
      - { window: [40, 182, 14, 60] }
      - { window: [246, 182, 14, 60] }
      - { window: [86, 240, 12, 40] }
      - { window: [202, 240, 12, 40] }
      - { circle: [150, 96, 19], fill: "#efe5cf" }
      - { line: [150, 96, 150, 83], width: 1.6 }
      - { line: [150, 96, 160, 100], width: 1.6 }
      - { text: "@landmark.counting_house.sign", at: [150, 164], size: 15 }

  - id: landmark.registry
    name: "@landmark.registry.name"
    width: 300
    height: 330
    palette: { body: "#c2b59a", roof: "#4f565d", trim: "#e6dcc4", door: "#3b3430" }
    body: [24, 276, 124]
    shapes:
      - { poly: [[10, 110], [150, 40], [290, 110]], fill: roof }
      - { poly: [[6, 110], [294, 110], [294, 124], [6, 124]], fill: trim }
      - { poly: [[24, 124], [276, 124], [276, 312], [24, 312]], fill: body }
      - { rect: [44, 124, 18, 188], fill: trim, repeat: [52, 2] }
      - { rect: [186, 124, 18, 188], fill: trim, repeat: [52, 2] }
      - { poly: [[10, 312], [290, 312], [290, 321], [10, 321]], fill: trim }
      - { poly: [[0, 321], [300, 321], [300, 330], [0, 330]], fill: trim }
      - { door: [126, 222, 48, 90] }
      - { window: [70, 150, 20, 56] }
      - { window: [212, 150, 20, 56] }
      - { window: [132, 146, 36, 40] }
      - { text: "@landmark.registry.sign", at: [150, 102], size: 14 }

