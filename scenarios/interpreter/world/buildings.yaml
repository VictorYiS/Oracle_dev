# Every building: where its lot is, how it is drawn, what it draws from the line, how it really is
# (truth) and what the institutions have on file (record). Record fields left out agree with the
# truth. A few deliberately do not: that is where the town's cases come from.
buildings:
  # ---- the street ---------------------------------------------------------------------------
  - id: bld.registry
    address: "@bld.registry.address"
    layer: layer.street
    x: -180
    width: 300
    depth: 140
    look: { landmark: landmark.registry }
    load: 3
    truth: { power: true, damaged: false }

  # ---- the riverbank, down the steps --------------------------------------------------------
  - id: bld.boathouse
    address: "@bld.boathouse.address"
    layer: layer.riverbank
    x: 180
    width: 260
    look: { recipe: recipe.works, seed: 3311, style: style.works }
    load: 1
    truth: { power: true, damaged: false }
  - id: bld.pump_house
    address: "@bld.pump_house.address"
    layer: layer.riverbank
    x: 2040
    width: 180
    look: { recipe: recipe.stack, seed: 902, style: style.shanty }
    load: 2
    truth: { power: true, damaged: false }

  # ---- the far bank, across the bridge -------------------------------------------------------
