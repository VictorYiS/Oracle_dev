# The people of the East Bank. `home` is where they really live; `registered` (if given) is where
# the registry has them, when that differs. Routines say where they go at what minute of the day.
routines:
  - id: routine.worker
    steps:
      - { at: 0, go: home }
      - { at: 400, go: work }
      - { at: 720, go: spot.market }
      - { at: 780, go: work }
      - { at: 1000, go: home }
  - id: routine.trader
    steps:
      - { at: 0, go: home }
      - { at: 380, go: work }
      - { at: 1020, go: home }
  - id: routine.homebody
    steps:
      - { at: 0, go: home }
      - { at: 660, go: spot.market }
      - { at: 760, go: home }

residents:
  - {
      id: person.mara,
      name: "@person.mara.name",
      home: bld.eb_02,
      work: spot.market,
      routine: routine.trader,
      look: { coat: "#7a3b2f" },
    }
